# SoundTouch presets package
# Defines: rooms (3 initial), failure policy selector, 6 preset scripts.
# Scripts publish JSON commands to MQTT; Node-RED handles the rest.
#
# MQTT command contract (topic: soundtouch/cmd/preset):
#   {
#     "preset": 1..6,
#     "rooms":  ["living_room", "kitchen", "bedroom"],   # selected only
#     "policy": "continue" | "strict"
#   }

input_boolean:
  st_room_living_room:
    name: Living room
    icon: mdi:sofa
  st_room_kitchen:
    name: Kitchen
    icon: mdi:silverware-fork-knife
  st_room_bedroom:
    name: Bedroom
    icon: mdi:bed

input_select:
  st_failure_policy:
    name: Failure policy
    icon: mdi:alert-decagram
    options:
      - continue
      - strict
    initial: continue

script:
  st_preset_play:
    alias: SoundTouch - play preset
    mode: queued
    fields:
      preset:
        description: Preset slot 1-6
        example: 1
    sequence:
      - variables:
          rooms: >-
            {% set r = [] %}
            {% if is_state('input_boolean.st_room_living_room', 'on') %}{% set r = r + ['living_room'] %}{% endif %}
            {% if is_state('input_boolean.st_room_kitchen', 'on') %}{% set r = r + ['kitchen'] %}{% endif %}
            {% if is_state('input_boolean.st_room_bedroom', 'on') %}{% set r = r + ['bedroom'] %}{% endif %}
            {{ r }}
      - service: mqtt.publish
        data:
          topic: soundtouch/cmd/preset
          payload: >-
            {
              "preset": {{ preset | int }},
              "rooms": {{ rooms | tojson }},
              "policy": "{{ states('input_select.st_failure_policy') }}"
            }
          qos: 1

  st_preset_1:
    alias: SoundTouch preset 1 (VRT Radio 1)
    sequence:
      - service: script.st_preset_play
        data: { preset: 1 }
  st_preset_2:
    alias: SoundTouch preset 2 (VRT Radio 2 Limburg)
    sequence:
      - service: script.st_preset_play
        data: { preset: 2 }
  st_preset_3:
    alias: SoundTouch preset 3 (Studio Brussel)
    sequence:
      - service: script.st_preset_play
        data: { preset: 3 }
  st_preset_4:
    alias: SoundTouch preset 4 (Joe)
    sequence:
      - service: script.st_preset_play
        data: { preset: 4 }
  st_preset_5:
    alias: SoundTouch preset 5 (Nostalgie Vlaanderen)
    sequence:
      - service: script.st_preset_play
        data: { preset: 5 }
  st_preset_6:
    alias: SoundTouch preset 6 (JOE Gold)
    sequence:
      - service: script.st_preset_play
        data: { preset: 6 }

  st_rebuild_library:
    alias: SoundTouch - rebuild Gerbera radio library
    sequence:
      - service: mqtt.publish
        data:
          topic: soundtouch/cmd/rebuild_library
          payload: '{"trigger": "ha"}'
          qos: 1

  st_push_presets:
    alias: SoundTouch - push presets to device (restores IR remote)
    sequence:
      - service: mqtt.publish
        data:
          topic: soundtouch/cmd/push_presets
          payload: '{"trigger": "ha"}'
          qos: 1
