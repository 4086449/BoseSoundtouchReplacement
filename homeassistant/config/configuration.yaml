# Home Assistant - SoundTouch Replacement
# Minimal config; all SoundTouch logic lives in packages/ and Node-RED.

default_config:

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - 172.16.0.0/12

# MQTT broker (Mosquitto on the same Compose network).
mqtt:
  broker: mosquitto
  port: 1883
  discovery: true

# All SoundTouch entities and scripts live in packages.
homeassistant:
  packages: !include_dir_named packages

# Lovelace dashboard for the SoundTouch control surface.
lovelace:
  mode: storage
  dashboards:
    soundtouch-dashboard:
      mode: yaml
      title: SoundTouch
      icon: mdi:speaker-multiple
      show_in_sidebar: true
      filename: dashboards/soundtouch.yaml
