services:
  radio-proxy:
    build: .
    container_name: soundtouch-radio-proxy
    restart: unless-stopped
    env_file: .env
    environment:
      - STATE_DIR=/app/state
      - BRIDGE_INTERNAL_URL=http://bose-bridge:8092
    ports:
      - "${PROXY_PORT:-8091}:${PROXY_PORT:-8091}"
    volumes:
      - ${FOLDER}/radio-state:/app/state
    command: python /app/proxy/radio-proxy.py

  bose-bridge:
    build: .
    container_name: soundtouch-bose-bridge
    restart: unless-stopped
    env_file: .env
    environment:
      - STATE_DIR=/app/state
    volumes:
      - ${FOLDER}/soundtouch-radio/radio-state:/app/state
    depends_on:
      - radio-proxy
    command: python /app/bridge/bose-preset-bridge.py

  nodered:
    build: ./nodered
    container_name: soundtouch-node-red
    restart: unless-stopped
    # ports:
    #   - "1880:1880"
    network_mode: host
    env_file: .env
    environment:
      - TZ=Europe/Amsterdam
      - PI_IP=${PI_IP:-10.0.0.241}
      - DEFAULT_BOSE_IP=${BOSE_IP:-10.0.0.199}
    volumes:
      - nodered-data:/data
    depends_on:
      - radio-proxy

  matter-server:
    image: ghcr.io/matter-js/python-matter-server:stable
    container_name: matter-server
    network_mode: host
    volumes:
      - ${FOLDER}/nodered/matter:/data
      # Required for Bluetooth via D-Bus
      - /run/dbus:/run/dbus:ro
    security_opt:
      - apparmor=unconfined
    restart: unless-stopped
    # If you adjust command line, make sure to pass the default CMD arguments too:
    #command: --storage-path /data --paa-root-cert-dir /data/credentials --bluetooth-adapter 0

volumes:
  nodered-data:
