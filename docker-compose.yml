services:
  radio-proxy:
    build: .
    container_name: soundtouch-radio-proxy
    restart: unless-stopped
    ports:
      - "8091:8091"
    command: python /app/soundtouch-proxy/radio-proxy.py

  bose-bridge:
    build: .
    container_name: soundtouch-bose-bridge
    restart: unless-stopped
    depends_on:
      - radio-proxy
    command: python /app/bose-bridge/bose-preset-bridge.py

  nodered:
    build: ./nodered
    container_name: soundtouch-node-red
    restart: unless-stopped
    ports:
      - "1880:1880"
    environment:
      - TZ=Europe/Amsterdam
      - PI_IP=${PI_IP:-10.0.0.241}
      - DEFAULT_BOSE_IP=${BOSE_IP:-10.0.0.199}
    volumes:
      - nodered-data:/data
    depends_on:
      - radio-proxy

volumes:
  nodered-data:
