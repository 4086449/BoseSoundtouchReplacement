# Mosquitto config - LAN-only test broker.
# NOT FOR INTERNET EXPOSURE. Anonymous access enabled for local development.
# Bind both listeners to all interfaces inside the container; the Compose port
# map controls host exposure.

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

listener 1883
protocol mqtt
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true
